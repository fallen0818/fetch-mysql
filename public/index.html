<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>dbpanelco Customer Search</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@6..144,1..1000&display=swap"
      rel="stylesheet"
    />
    <style>
      /* ------------------------------------------------------------------ */
      /* Light theme (default)                                              */
      /* ------------------------------------------------------------------ */
      :root,
      [data-theme="light"] {
        --bg: linear-gradient(135deg, #e0e7ff 0%, #f0fdfa 50%, #fdf2f8 100%);
        --bg-solid: #eef2ff;
        --panel: rgba(255, 255, 255, 0.85);
        --panel-shadow: 0 12px 40px rgba(99, 102, 241, 0.1), 0 2px 8px rgba(0,0,0,0.04);
        --accent: #6366f1;
        --accent-hover: #4f46e5;
        --accent-glow: rgba(99, 102, 241, 0.18);
        --text: #1e1b4b;
        --text-secondary: #3730a3;
        --muted: #6366f1;
        --border: rgba(99, 102, 241, 0.15);
        --input-bg: rgba(255, 255, 255, 0.9);
        --input-border: rgba(99, 102, 241, 0.2);
        --input-focus: rgba(99, 102, 241, 0.3);
        --table-bg: rgba(255, 255, 255, 0.7);
        --table-header-bg: linear-gradient(135deg, #6366f1, #8b5cf6);
        --table-header-text: #ffffff;
        --table-row-alt: rgba(238, 242, 255, 0.6);
        --table-row-hover: rgba(99, 102, 241, 0.08);
        --table-border: rgba(99, 102, 241, 0.08);
        --btn-secondary-bg: rgba(99, 102, 241, 0.1);
        --btn-secondary-text: #4f46e5;
        --btn-secondary-hover: rgba(99, 102, 241, 0.18);
        --badge-active: #dcfce7;
        --badge-active-text: #166534;
        --suggest-bg: rgba(255, 255, 255, 0.95);
        --suggest-hover: rgba(99, 102, 241, 0.08);
        --suggest-border: rgba(99, 102, 241, 0.1);
        --suggest-text: #1e1b4b;
        --suggest-meta: #6366f1;
        --modal-overlay: rgba(30, 27, 75, 0.55);
        --modal-bg: linear-gradient(180deg, #1e1b4b 0%, #312e81 100%);
        --modal-text: #e0e7ff;
        --modal-border: rgba(129, 140, 248, 0.35);
        --modal-shadow: rgba(99, 102, 241, 0.3);
        --history-th-bg: rgba(99, 102, 241, 0.25);
        --history-td-bg: rgba(30, 27, 75, 0.4);
        --history-td-alt: rgba(49, 46, 129, 0.4);
        --history-hover: rgba(129, 140, 248, 0.2);
        --history-border: rgba(129, 140, 248, 0.15);
        --toggle-bg: rgba(99, 102, 241, 0.15);
        --toggle-knob: #ffffff;
        --toggle-icon: #f59e0b;
        --export-bg: #10b981;
        --export-hover: #059669;
        --empty-text: #a5b4fc;
        --page-info: #6366f1;
        --scrollbar-track: rgba(99,102,241,0.04);
        --scrollbar-thumb: rgba(99,102,241,0.18);
        --transition-speed: 0.35s;
      }

      /* ------------------------------------------------------------------ */
      /* Dark vibrant theme                                                 */
      /* ------------------------------------------------------------------ */
      [data-theme="dark"] {
        --bg: linear-gradient(135deg, #0c0a1d 0%, #0f172a 40%, #0a1628 100%);
        --bg-solid: #0c0a1d;
        --panel: rgba(15, 14, 36, 0.8);
        --panel-shadow: 0 12px 40px rgba(139, 92, 246, 0.12), 0 0 80px rgba(99, 102, 241, 0.05);
        --accent: #a78bfa;
        --accent-hover: #8b5cf6;
        --accent-glow: rgba(167, 139, 250, 0.2);
        --text: #f5f3ff;
        --text-secondary: #c4b5fd;
        --muted: #a78bfa;
        --border: rgba(139, 92, 246, 0.15);
        --input-bg: rgba(30, 27, 75, 0.5);
        --input-border: rgba(139, 92, 246, 0.2);
        --input-focus: rgba(167, 139, 250, 0.35);
        --table-bg: rgba(15, 14, 36, 0.5);
        --table-header-bg: linear-gradient(135deg, rgba(139, 92, 246, 0.2), rgba(236, 72, 153, 0.12));
        --table-header-text: #ddd6fe;
        --table-row-alt: rgba(30, 27, 75, 0.3);
        --table-row-hover: rgba(139, 92, 246, 0.1);
        --table-border: rgba(139, 92, 246, 0.08);
        --btn-secondary-bg: rgba(139, 92, 246, 0.12);
        --btn-secondary-text: #c4b5fd;
        --btn-secondary-hover: rgba(139, 92, 246, 0.22);
        --badge-active: rgba(52, 211, 153, 0.15);
        --badge-active-text: #6ee7b7;
        --suggest-bg: rgba(15, 14, 36, 0.95);
        --suggest-hover: rgba(139, 92, 246, 0.12);
        --suggest-border: rgba(139, 92, 246, 0.1);
        --suggest-text: #f5f3ff;
        --suggest-meta: #a78bfa;
        --modal-overlay: rgba(0, 0, 0, 0.7);
        --modal-bg: linear-gradient(180deg, #0f0e24 0%, #1a1640 100%);
        --modal-text: #ede9fe;
        --modal-border: rgba(167, 139, 250, 0.3);
        --modal-shadow: rgba(139, 92, 246, 0.25);
        --history-th-bg: rgba(139, 92, 246, 0.18);
        --history-td-bg: rgba(15, 14, 36, 0.5);
        --history-td-alt: rgba(26, 22, 64, 0.5);
        --history-hover: rgba(167, 139, 250, 0.15);
        --history-border: rgba(139, 92, 246, 0.1);
        --toggle-bg: rgba(139, 92, 246, 0.2);
        --toggle-knob: #a78bfa;
        --toggle-icon: #a78bfa;
        --export-bg: #10b981;
        --export-hover: #059669;
        --empty-text: #6d28d9;
        --page-info: #a78bfa;
        --scrollbar-track: rgba(139,92,246,0.04);
        --scrollbar-thumb: rgba(139,92,246,0.18);
      }

      /* ------------------------------------------------------------------ */
      /* Base                                                               */
      /* ------------------------------------------------------------------ */
      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: "Google Sans Flex", Arial, sans-serif;
        background: var(--bg);
        background-color: var(--bg-solid);
        background-attachment: fixed;
        color: var(--text);
        min-height: 100vh;
        transition: background-color var(--transition-speed) ease, color var(--transition-speed) ease;
      }

      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: var(--scrollbar-track); }
      ::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius: 4px; }

      /* ------------------------------------------------------------------ */
      /* Layout                                                             */
      /* ------------------------------------------------------------------ */
      .container {
        max-width: 1100px;
        margin: 40px auto;
        padding: 24px;
      }

      .panel {
        background: var(--panel);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid var(--border);
        border-radius: 16px;
        box-shadow: var(--panel-shadow);
        padding: 30px;
        transition: background var(--transition-speed) ease,
                    border-color var(--transition-speed) ease,
                    box-shadow var(--transition-speed) ease;
      }

      /* ------------------------------------------------------------------ */
      /* Header bar                                                         */
      /* ------------------------------------------------------------------ */
      .header-bar {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 24px;
      }

      .header-bar h1 {
        margin: 0 0 4px;
        font-size: 2rem;
      }

      .header-bar .subtitle {
        margin: 0;
        color: var(--muted);
        transition: color var(--transition-speed) ease;
      }

      /* ------------------------------------------------------------------ */
      /* Theme toggle                                                       */
      /* ------------------------------------------------------------------ */
      .theme-toggle {
        position: relative;
        width: 56px;
        height: 30px;
        flex-shrink: 0;
        margin-top: 6px;
        border: none;
        border-radius: 999px;
        background: var(--toggle-bg);
        cursor: pointer;
        transition: background var(--transition-speed) ease;
        padding: 0;
      }

      .theme-toggle .knob {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 24px;
        height: 24px;
        border-radius: 50%;
        background: var(--toggle-knob);
        box-shadow: 0 1px 4px rgba(0,0,0,0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: transform var(--transition-speed) ease, background var(--transition-speed) ease;
      }

      [data-theme="dark"] .theme-toggle .knob {
        transform: translateX(26px);
      }

      .knob svg {
        width: 14px;
        height: 14px;
        fill: var(--toggle-icon);
        transition: fill var(--transition-speed) ease;
      }

      .sun-icon { display: block; }
      .moon-icon { display: none; }
      [data-theme="dark"] .sun-icon { display: none; }
      [data-theme="dark"] .moon-icon { display: block; }

      /* ------------------------------------------------------------------ */
      /* Search bar                                                         */
      /* ------------------------------------------------------------------ */
      .search-bar {
        display: flex;
        gap: 12px;
        margin-bottom: 18px;
        flex-wrap: wrap;
      }

      .search-wrap {
        position: relative;
        flex: 1 1 260px;
      }

      .search-wrap input { width: 100%; }

      input, select {
        flex: 1 1 200px;
        padding: 12px 14px;
        border: 1px solid var(--input-border);
        border-radius: 10px;
        font-size: 1rem;
        font-family: inherit;
        background: var(--input-bg);
        color: var(--text);
        transition: background var(--transition-speed) ease,
                    border-color var(--transition-speed) ease,
                    color var(--transition-speed) ease;
      }

      input::placeholder { color: var(--muted); }
      select { color: var(--text); }
      select option { background: var(--panel); color: var(--text); }

      input:focus, select:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--input-focus);
      }

      /* ------------------------------------------------------------------ */
      /* Buttons                                                            */
      /* ------------------------------------------------------------------ */
      button {
        border: none;
        background: var(--accent);
        color: #fff;
        padding: 12px 18px;
        border-radius: 10px;
        font-size: 1rem;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: background 0.2s ease, transform 0.1s ease;
      }

      button:hover { background: var(--accent-hover); }
      button:active { transform: scale(0.97); }

      .secondary {
        background: var(--btn-secondary-bg);
        color: var(--btn-secondary-text);
      }

      .secondary:hover { background: var(--btn-secondary-hover); }

      button:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        transform: none;
      }

      /* ------------------------------------------------------------------ */
      /* Status & summary                                                   */
      /* ------------------------------------------------------------------ */
      .status {
        margin-bottom: 18px;
        color: var(--muted);
        transition: color var(--transition-speed) ease;
      }

      .empty {
        color: var(--empty-text);
        font-style: italic;
      }

      /* ------------------------------------------------------------------ */
      /* Main table                                                         */
      /* ------------------------------------------------------------------ */
      .table-wrap {
        border-radius: 12px;
        overflow: hidden;
        border: 1px solid var(--table-border);
        transition: border-color var(--transition-speed) ease;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--table-bg);
        transition: background var(--transition-speed) ease;
      }

      th, td {
        border: 1px solid var(--table-border);
        padding: 10px 12px;
        text-align: left;
        vertical-align: top;
        transition: background var(--transition-speed) ease,
                    border-color var(--transition-speed) ease,
                    color var(--transition-speed) ease;
      }

      th {
        background: var(--table-header-bg);
        color: var(--table-header-text);
        font-weight: 700;
        font-size: 0.85rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        border-color: transparent;
      }

      th[data-sort] {
        cursor: pointer;
        user-select: none;
      }

      th[data-sort]:hover {
        filter: brightness(1.12);
      }

      th[data-sort]::after {
        content: "";
        display: inline-block;
        width: 0.7em;
        margin-left: 6px;
        opacity: 0.5;
      }

      th[data-sort].sort-asc::after {
        content: "\25B2";
        opacity: 1;
      }

      th[data-sort].sort-desc::after {
        content: "\25BC";
        opacity: 1;
      }

      tbody tr { cursor: pointer; }

      tbody tr:nth-child(even) td {
        background: var(--table-row-alt);
      }

      tbody tr:hover td {
        background: var(--table-row-hover);
      }

      /* ------------------------------------------------------------------ */
      /* Suggestions dropdown                                               */
      /* ------------------------------------------------------------------ */
      .suggestions {
        position: absolute;
        top: calc(100% + 8px);
        left: 0;
        right: 0;
        background: var(--suggest-bg);
        border: 1px solid var(--suggest-border);
        border-radius: 10px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
        z-index: 10;
        overflow: hidden;
        display: none;
        transition: background var(--transition-speed) ease,
                    border-color var(--transition-speed) ease;
      }

      .suggestion-item {
        padding: 12px 14px;
        border-bottom: 1px solid var(--suggest-border);
        cursor: pointer;
        color: var(--suggest-text);
        transition: background 0.15s ease, color 0.15s ease;
      }

      .suggestion-item:last-child { border-bottom: none; }

      .suggestion-item:hover,
      .suggestion-item:focus {
        background: var(--suggest-hover);
        outline: none;
      }

      .suggestion-name { font-weight: 700; color: inherit; }

      .suggestion-meta {
        color: var(--suggest-meta);
        font-size: 0.85rem;
        margin-top: 4px;
      }

      .suggestion-item:hover .suggestion-meta,
      .suggestion-item:focus .suggestion-meta {
        color: var(--text-secondary);
      }

      /* ------------------------------------------------------------------ */
      /* History modal (always dark)                                        */
      /* ------------------------------------------------------------------ */
      .modal {
        position: fixed;
        inset: 0;
        background: var(--modal-overlay);
        display: none;
        align-items: center;
        justify-content: center;
        padding: 20px;
        z-index: 30;
        backdrop-filter: blur(6px);
      }

      .modal.open { display: flex; }

      .modal-content {
        background: var(--modal-bg);
        color: var(--modal-text);
        width: min(760px, 100%);
        max-height: 82vh;
        border-radius: 18px;
        padding: 24px 24px 18px;
        box-shadow: 0 18px 50px var(--modal-shadow);
        position: relative;
        border: 1px solid var(--modal-border);
      }

      .modal-close {
        position: absolute;
        right: 14px;
        top: 10px;
        border: none;
        background: transparent;
        font-size: 1.9rem;
        color: #cbd5e1;
        cursor: pointer;
        padding: 4px 8px;
      }

      .modal-close:hover { color: #f1f5f9; background: transparent; }

      #historyTitle {
        margin: 0 0 8px;
        font-size: 1.5rem;
        color: #f8fafc;
      }

      #historySummary {
        color: #cbd5e1;
        margin-bottom: 14px;
      }

      .history-actions {
        display: flex;
        justify-content: flex-end;
        margin: 8px 0 12px;
      }

      .history-download {
        background: var(--export-bg);
        color: white;
      }

      .history-download:hover {
        background: var(--export-hover);
      }

      .history-scroll {
        max-height: 52vh;
        overflow: auto;
        border-radius: 12px;
        border: 1px solid var(--history-border);
        background: rgba(15, 23, 42, 0.85);
      }

      .history-table {
        width: 100%;
        margin-top: 0;
        border-collapse: collapse;
      }

      .history-table thead th {
        position: sticky;
        top: 0;
        z-index: 1;
        background: var(--history-th-bg);
        color: #c7d2fe;
        border-color: var(--history-border);
      }

      .history-table tbody td {
        background: var(--history-td-bg);
        color: #e2e8f0;
        border-color: var(--history-border);
      }

      .history-table tbody tr:nth-child(even) td {
        background: var(--history-td-alt);
      }

      .history-table tbody tr:hover td {
        background: var(--history-hover);
        color: #f8fafc;
      }

      /* ------------------------------------------------------------------ */
      /* Pagination                                                         */
      /* ------------------------------------------------------------------ */
      .pagination-bar {
        display: flex;
        margin-top: 18px;
        justify-content: space-between;
        align-items: center;
      }

      .export-bar {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-bottom: 10px;
      }

      .pagination-bar .status {
        margin: 0;
        color: var(--page-info);
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="panel">

        <div class="header-bar">
          <div>
            <h1>Customer Search</h1>
            <p class="subtitle">dbpanelco &rarr; tblcustomer</p>
          </div>
          <button
            id="themeToggle"
            class="theme-toggle"
            type="button"
            aria-label="Toggle dark mode"
          >
            <span class="knob">
              <svg class="sun-icon" viewBox="0 0 24 24"><path d="M12 17a5 5 0 100-10 5 5 0 000 10zm0-13a1 1 0 011 1v1a1 1 0 11-2 0V5a1 1 0 011-1zm0 16a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zm8.66-12.66a1 1 0 010 1.41l-.7.71a1 1 0 11-1.42-1.42l.71-.7a1 1 0 011.41 0zM4.05 18.36a1 1 0 010 1.41l-.7.71a1 1 0 11-1.42-1.42l.71-.7a1 1 0 011.41 0zM23 12a1 1 0 01-1 1h-1a1 1 0 110-2h1a1 1 0 011 1zM4 12a1 1 0 01-1 1H2a1 1 0 110-2h1a1 1 0 011 1zm16.95-6.95a1 1 0 010 1.41l-.71.71a1 1 0 01-1.41-1.42l.7-.7a1 1 0 011.42 0zM5.64 18.36a1 1 0 010 1.41l-.71.71a1 1 0 01-1.41-1.42l.7-.7a1 1 0 011.42 0z"/></svg>
              <svg class="moon-icon" viewBox="0 0 24 24"><path d="M12 3a9 9 0 109 9c0-.46-.04-.92-.1-1.36a5.4 5.4 0 01-4.4 2.26 5.4 5.4 0 01-3.14-1 5.4 5.4 0 01-2.26-4.4c0-1.68.77-3.19 1.97-4.2A9.06 9.06 0 0012 3z"/></svg>
            </span>
          </button>
        </div>

        <form id="searchForm" class="search-bar">
          <div class="search-wrap">
            <input
              id="searchInput"
              type="text"
              placeholder="Type a customer name to search"
              autocomplete="off"
            />
            <div id="suggestions" class="suggestions" aria-live="polite"></div>
          </div>
          <input
            id="routeFilter"
            type="number"
            min="1"
            placeholder="Route number"
          />
          <select id="townFilter">
            <option value="">All towns</option>
          </select>
          <select id="barangayFilter">
            <option value="">All barangays</option>
          </select>
          <select id="readingFilter">
            <option value="">All readings</option>
            <option value="zero">Zero only</option>
            <option value="nonzero">Non-zero only</option>
          </select>
          <select id="statusFilter">
            <option value="">All status</option>
            <option value="Active">Active</option>
            <option value="Inactive">Inactive</option>
            <option value="Disconnected">Disconnected</option>
          </select>
          <select id="monthFilter">
            <option value="">Loading months...</option>
          </select>
          <button type="submit">Search</button>
          <button id="clearFilters" type="button" class="secondary">
            Clear
          </button>
        </form>

        <div id="status" class="status">Loading customers...</div>
        <div
          id="summary"
          class="status"
          style="margin-top: -8px; margin-bottom: 12px"
        ></div>

        <div class="export-bar">
          <button id="exportResultsCsv" type="button" class="history-download secondary">
            Export Page
          </button>
          <button id="exportAllCsv" type="button" class="history-download">
            Export All Matches
          </button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th data-sort="id">ID</th>
                <th data-sort="name">Name</th>
                <th data-sort="type">Type</th>
                <th data-sort="address">Address</th>
                <th data-sort="barangay">Barangay</th>
                <th data-sort="town">Town</th>
                <th data-sort="route">Route</th>
                <th data-sort="status">Status</th>
                <th id="kwhHeader" data-sort="kwh" style="text-align:center">KWh 2026-07</th>
              </tr>
            </thead>
            <tbody id="resultsBody">
              <tr>
                <td colspan="9" class="empty">No results yet.</td>
              </tr>
            </tbody>
          </table>
        </div>

        <div class="pagination-bar">
          <button id="prevPage" type="button" class="secondary">
            Previous
          </button>
          <div id="pageInfo" class="status">Page 1</div>
          <button id="nextPage" type="button" class="secondary">Next</button>
        </div>
      </div>
    </div>

    <!-- History modal -->
    <div id="historyModal" class="modal" aria-hidden="true">
      <div class="modal-content">
        <button id="closeHistoryModal" class="modal-close" type="button">
          &times;
        </button>
        <h2 id="historyTitle">Customer KWh History</h2>
        <div id="historySummary" class="status"></div>
        <div class="history-actions">
          <button
            id="downloadHistoryCsv"
            type="button"
            class="history-download"
          >
            Export CSV
          </button>
        </div>
        <div class="history-scroll">
          <table class="history-table">
            <thead>
              <tr>
                <th>Month</th>
                <th style="text-align:center">KWh</th>
              </tr>
            </thead>
            <tbody id="historyBody"></tbody>
          </table>
        </div>
      </div>
    </div>

    <script>
      /* ================================================================== */
      /* Theme toggle                                                       */
      /* ================================================================== */
      const themeToggle = document.getElementById("themeToggle");
      const htmlEl = document.documentElement;

      function applyTheme(theme) {
        htmlEl.setAttribute("data-theme", theme);
        localStorage.setItem("theme", theme);
      }

      // Restore saved preference or respect OS setting
      (function initTheme() {
        const saved = localStorage.getItem("theme");
        if (saved) {
          applyTheme(saved);
        } else if (window.matchMedia("(prefers-color-scheme: dark)").matches) {
          applyTheme("dark");
        }
      })();

      themeToggle.addEventListener("click", () => {
        const next = htmlEl.getAttribute("data-theme") === "dark" ? "light" : "dark";
        applyTheme(next);
      });

      /* ================================================================== */
      /* DOM refs                                                           */
      /* ================================================================== */
      const searchForm = document.getElementById("searchForm");
      const searchInput = document.getElementById("searchInput");
      const routeFilter = document.getElementById("routeFilter");
      const townFilter = document.getElementById("townFilter");
      const barangayFilter = document.getElementById("barangayFilter");
      const readingFilter = document.getElementById("readingFilter");
      const statusFilter = document.getElementById("statusFilter");
      const monthFilter = document.getElementById("monthFilter");
      const clearFiltersBtn = document.getElementById("clearFilters");
      const statusBox = document.getElementById("status");
      const summaryBox = document.getElementById("summary");
      const resultsBody = document.getElementById("resultsBody");
      const suggestionsBox = document.getElementById("suggestions");
      const kwhHeader = document.getElementById("kwhHeader");
      const prevPageBtn = document.getElementById("prevPage");
      const nextPageBtn = document.getElementById("nextPage");
      const pageInfo = document.getElementById("pageInfo");
      const historyModal = document.getElementById("historyModal");
      const historyTitle = document.getElementById("historyTitle");
      const historySummary = document.getElementById("historySummary");
      const historyBody = document.getElementById("historyBody");
      const closeHistoryModalBtn = document.getElementById("closeHistoryModal");
      const downloadHistoryCsvBtn =
        document.getElementById("downloadHistoryCsv");
      const exportResultsCsvBtn =
        document.getElementById("exportResultsCsv");
      const exportAllCsvBtn = document.getElementById("exportAllCsv");

      let debounceTimer = null;
      let currentPage = 1;
      let totalPages = 1;
      let currentResults = [];
      let currentResultsMonth = "";
      let currentHistoryRows = [];
      let currentCustomerName = "customer";
      let currentCustomerDetails = {};
      let defaultMonthValue = "";
      let monthLabels = {};
      let currentSortKey = "id";
      let currentSortDir = "desc";

      const sortableHeaders = document.querySelectorAll("th[data-sort]");

      /* ================================================================== */
      /* Helpers                                                            */
      /* ================================================================== */
      function formatMonthLabel(monthKey) {
        const match = /^kwh(\d{4})(\d{2})$/.exec(String(monthKey || ""));
        if (!match) return String(monthKey || "KWh");
        return `${match[1]}-${match[2]}`;
      }

      function escapeHtml(value) {
        return String(value ?? "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");
      }

      function updateKwhHeader(month) {
        const label = monthLabels[month] || formatMonthLabel(month) || "KWh";
        kwhHeader.textContent = `KWh ${label}`;
      }

      function updatePaginationControls() {
        prevPageBtn.disabled = currentPage <= 1;
        nextPageBtn.disabled = currentPage >= totalPages || totalPages === 0;
        pageInfo.textContent =
          totalPages > 0 ? `Page ${currentPage} of ${totalPages}` : "Page 1";
      }

      /* ================================================================== */
      /* Column sorting                                                     */
      /* ================================================================== */
      function updateSortIndicators() {
        sortableHeaders.forEach((th) => {
          th.classList.remove("sort-asc", "sort-desc");
          if (th.dataset.sort === currentSortKey) {
            th.classList.add(currentSortDir === "asc" ? "sort-asc" : "sort-desc");
          }
        });
      }

      sortableHeaders.forEach((th) => {
        th.addEventListener("click", () => {
          const key = th.dataset.sort;
          if (currentSortKey === key) {
            currentSortDir = currentSortDir === "asc" ? "desc" : "asc";
          } else {
            currentSortKey = key;
            currentSortDir = "asc";
          }
          updateSortIndicators();
          currentPage = 1;
          triggerSearch();
        });
      });

      updateSortIndicators();

      /* ================================================================== */
      /* Month options                                                      */
      /* ================================================================== */
      function setMonthOptions(months, defaultMonth = "") {
        const safeMonths = Array.isArray(months) ? months : [];
        defaultMonthValue =
          defaultMonth || safeMonths[safeMonths.length - 1] || "";
        monthLabels = {};
        safeMonths.forEach((month) => {
          monthLabels[month] = formatMonthLabel(month);
        });

        monthFilter.innerHTML = safeMonths.length
          ? safeMonths
              .map(
                (month) =>
                  `<option value="${month}" ${month === defaultMonth ? "selected" : ""}>${formatMonthLabel(month)}</option>`,
              )
              .join("")
          : '<option value="">No months available</option>';

        if (safeMonths.length && !monthFilter.value) {
          monthFilter.value = defaultMonthValue;
        }
        updateKwhHeader(monthFilter.value || defaultMonthValue || "");
      }

      async function loadAvailableMonths() {
        try {
          const response = await fetch("/api/months");
          if (!response.ok) return;

          const data = await response.json();
          const months = Array.isArray(data.months) ? data.months : [];
          const defaultMonth =
            data.defaultMonth || months[months.length - 1] || "";
          setMonthOptions(months, defaultMonth);
          await loadFilters();
          if (months.length) {
            searchCustomers(
              searchInput.value.trim(),
              statusFilter.value,
              routeFilter.value.trim(),
              townFilter.value,
              barangayFilter.value,
              defaultMonth,
              1,
            );
          }
        } catch (error) {
          monthFilter.innerHTML = '<option value="kwh202607">2026-07</option>';
          monthFilter.value = "kwh202607";
          updateKwhHeader("kwh202607");
        }
      }

      async function loadFilters(selectedTown) {
        try {
          const url = selectedTown
            ? `/api/filters?town=${encodeURIComponent(selectedTown)}`
            : "/api/filters";
          const response = await fetch(url);
          if (!response.ok) return;

          const data = await response.json();
          const towns = (Array.isArray(data.towns) ? data.towns : []).filter(Boolean);
          const barangays = (Array.isArray(data.barangays) ? data.barangays : []).filter(Boolean);

          const prevTown = townFilter.value;
          townFilter.innerHTML = '<option value="">All towns</option>';
          towns.forEach((t) => {
            const opt = document.createElement("option");
            opt.value = t;
            opt.textContent = t;
            if (t === prevTown) opt.selected = true;
            townFilter.appendChild(opt);
          });

          const prevBrgy = barangayFilter.value;
          barangayFilter.innerHTML = '<option value="">All barangays</option>';
          barangays.forEach((b) => {
            const opt = document.createElement("option");
            opt.value = b;
            opt.textContent = b;
            if (b === prevBrgy) opt.selected = true;
            barangayFilter.appendChild(opt);
          });
        } catch (error) {
          // keep existing options on failure
        }
      }

      /* ================================================================== */
      /* Suggestions                                                        */
      /* ================================================================== */
      function renderSuggestions(customers) {
        if (!customers.length) {
          suggestionsBox.innerHTML = "";
          suggestionsBox.style.display = "none";
          return;
        }

        suggestionsBox.innerHTML = customers
          .map(
            (customer) => `
              <div
                class="suggestion-item"
                data-name="${escapeHtml(customer.cname || "")}"
                data-customer-id="${customer.customerid ?? ""}"
                tabindex="0"
              >
                <div class="suggestion-name">${escapeHtml(customer.cname || "-")}</div>
                <div class="suggestion-meta">
                  Route ${escapeHtml(customer.RouteNumber ?? "-")} &middot; ${escapeHtml(customer.status ?? "-")} &middot; ${Number(customer.kwh ?? 0)} kWh
                </div>
              </div>
            `,
          )
          .join("");

        suggestionsBox.style.display = "block";
      }

      async function fetchSuggestions(query) {
        const value = query.trim();
        if (!value || value.length < 2) {
          renderSuggestions([]);
          return;
        }

        try {
          const response = await fetch(
            `/api/customers?q=${encodeURIComponent(value)}&month=${encodeURIComponent(monthFilter.value)}&page=1&pageSize=6`,
          );

          if (!response.ok) { renderSuggestions([]); return; }

          const data = await response.json();
          renderSuggestions((data.results || []).slice(0, 6));
        } catch (error) {
          renderSuggestions([]);
        }
      }

      /* ================================================================== */
      /* Search                                                             */
      /* ================================================================== */
      async function searchCustomers(
        query = "",
        status = "",
        routeNumber = "",
        town = "",
        barangay = "",
        month = "kwh202607",
        page = 1,
      ) {
        currentPage = page;
        updateKwhHeader(month);
        const searchLabel = query || status || routeNumber || town || barangay;
        statusBox.textContent = searchLabel
          ? `Searching for "${searchLabel}"...`
          : "Loading customers...";

        try {
          const reading = readingFilter.value;
          const response = await fetch(
            `/api/customers?q=${encodeURIComponent(query)}&status=${encodeURIComponent(status)}&routeNumber=${encodeURIComponent(routeNumber)}&town=${encodeURIComponent(town)}&barangay=${encodeURIComponent(barangay)}&reading=${encodeURIComponent(reading)}&month=${encodeURIComponent(month)}&sort=${encodeURIComponent(currentSortKey)}&dir=${encodeURIComponent(currentSortDir)}&page=${page}&pageSize=20`,
          );
          const contentType = response.headers.get("content-type") || "";

          if (!contentType.includes("application/json")) {
            throw new Error(
              "The server returned HTML instead of JSON. Open http://localhost:3000 and make sure the app is running.",
            );
          }

          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message || "Search failed.");
          }

          const results = data.results || [];
          totalPages = data.totalPages || 1;
          currentResults = results;
          currentResultsMonth = month;

          summaryBox.textContent = `Total matches: ${data.total || 0} \u00b7 Total KWh (${monthLabels[month] || month}): ${data.totalKwh ?? 0}`;

          if (!results.length) {
            resultsBody.innerHTML =
              '<tr><td colspan="9" class="empty">No matching customers found.</td></tr>';
            statusBox.textContent =
              query || status || routeNumber
                ? `No results for "${query || status || routeNumber}".`
                : "No customers found.";
            updatePaginationControls();
            return;
          }

          resultsBody.innerHTML = results
            .map(
              (row) => `
                <tr data-customer-id="${row.customerid ?? ""}">
                  <td>${row.customerid ?? "-"}</td>
                  <td>${row.cname ?? "-"}</td>
                  <td>${row.ctype ?? "-"}</td>
                  <td>${row.caddress ?? "-"}</td>
                  <td>${row.Barangay ?? "-"}</td>
                  <td>${row.Town ?? "-"}</td>
                  <td>${row.RouteNumber ?? "-"}</td>
                  <td>${row.status ?? "-"}</td>
                  <td style="text-align:center">${row.kwh ?? 0}</td>
                </tr>
              `,
            )
            .join("");

          statusBox.textContent = `Showing ${results.length} customer(s).`;
          updatePaginationControls();
        } catch (error) {
          resultsBody.innerHTML =
            '<tr><td colspan="9" class="empty">Unable to search customers.</td></tr>';
          statusBox.textContent = error.message;
          summaryBox.textContent = "";
          updatePaginationControls();
        }
      }

      function triggerSearch() {
        const query = searchInput.value.trim();
        const status = statusFilter.value;
        const routeNumber = routeFilter.value.trim();
        const town = townFilter.value;
        const barangay = barangayFilter.value;
        const month = monthFilter.value;

        if (debounceTimer) clearTimeout(debounceTimer);

        debounceTimer = setTimeout(() => {
          searchCustomers(query, status, routeNumber, town, barangay, month, 1);
        }, 250);
      }

      function selectSuggestedCustomer(customerId, name) {
        searchInput.value = name;
        suggestionsBox.innerHTML = "";
        suggestionsBox.style.display = "none";
        if (customerId) openHistoryModal(customerId);
        searchCustomers(
          name,
          statusFilter.value,
          routeFilter.value.trim(),
          townFilter.value,
          barangayFilter.value,
          monthFilter.value,
          1,
        );
      }

      function csvCell(value) {
        return `"${String(value ?? "").replace(/"/g, '""')}"`;
      }

      function currentFilterQueryString() {
        const params = new URLSearchParams({
          q: searchInput.value.trim(),
          status: statusFilter.value,
          routeNumber: routeFilter.value.trim(),
          town: townFilter.value,
          barangay: barangayFilter.value,
          reading: readingFilter.value,
          month: monthFilter.value,
          sort: currentSortKey,
          dir: currentSortDir,
        });
        return params.toString();
      }

      async function exportAllToCsv() {
        const btn = exportAllCsvBtn;
        const originalText = btn.textContent;
        btn.disabled = true;
        btn.textContent = "Preparing...";
        try {
          const response = await fetch(
            `/api/customers/export?${currentFilterQueryString()}`
          );
          if (!response.ok) {
            let msg = "Export failed.";
            try {
              const err = await response.json();
              msg = err.message || msg;
            } catch (_) {}
            throw new Error(msg);
          }

          const blob = await response.blob();
          const url = URL.createObjectURL(blob);
          const link = document.createElement("a");
          link.href = url;
          const month = monthFilter.value || "export";
          link.download = `customers_${month}_all.csv`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
          URL.revokeObjectURL(url);
        } catch (error) {
          statusBox.textContent = error.message;
        } finally {
          btn.disabled = false;
          btn.textContent = originalText;
        }
      }

      function exportResultsToCsv() {
        if (!currentResults.length) {
          statusBox.textContent = "There are no results to export.";
          return;
        }

        const monthLabel =
          monthLabels[currentResultsMonth] ||
          formatMonthLabel(currentResultsMonth) ||
          "KWh";

        const header = [
          "Customer ID",
          "Name",
          "Type",
          "Address",
          "Barangay",
          "Town",
          "Route",
          "Status",
          `KWh ${monthLabel}`,
        ];

        const rows = currentResults.map((r) => [
          r.customerid ?? "",
          r.cname ?? "",
          r.ctype ?? "",
          r.caddress ?? "",
          r.Barangay ?? "",
          r.Town ?? "",
          r.RouteNumber ?? "",
          r.status ?? "",
          Number(r.kwh ?? 0),
        ]);

        const csvContent = [header, ...rows]
          .map((row) => row.map(csvCell).join(","))
          .join("\r\n");

        // Prepend BOM so Excel reads UTF-8 (Ñ, é, etc.) correctly
        const blob = new Blob(["\uFEFF" + csvContent], {
          type: "text/csv;charset=utf-8;",
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `customers_${currentResultsMonth || "export"}_page${currentPage}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }

      /* ================================================================== */
      /* History modal                                                      */
      /* ================================================================== */
      function downloadCsvHistory() {
        if (!currentHistoryRows.length) {
          statusBox.textContent = "There is no KWh history to export yet.";
          return;
        }

        const customer = currentCustomerDetails || {};
        const csvRows = [
          ["Customer ID", customer.customerid ?? ""],
          ["Customer Name", customer.cname ?? ""],
          ["Customer Type", customer.ctype ?? ""],
          ["Address", customer.caddress ?? ""],
          ["Barangay", customer.Barangay ?? ""],
          ["Town", customer.Town ?? ""],
          ["Route Number", customer.RouteNumber ?? ""],
          ["Status", customer.status ?? ""],
          [],
          ["Month", "KWh"],
          ...currentHistoryRows.map((row) => [
            row.label,
            Number(row.value || 0),
          ]),
        ];

        const csvContent = csvRows
          .map((row) =>
            row
              .map((value) => `"${String(value).replace(/"/g, '""')}"`)
              .join(","),
          )
          .join("\n");

        const blob = new Blob([csvContent], {
          type: "text/csv;charset=utf-8;",
        });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = `${currentCustomerName.toLowerCase().replace(/[^a-z0-9]+/g, "_") || "customer"}_kwh_history.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      }

      async function openHistoryModal(customerId) {
        if (!customerId) return;
        try {
          const response = await fetch(`/api/customer/${encodeURIComponent(customerId)}/history`);
          const data = await response.json();

          if (!response.ok) {
            throw new Error(data.message || "Unable to load customer history.");
          }

          const customer = data.customer || {};
          const history = data.history || [];

          currentHistoryRows = history;
          currentCustomerName = customer.cname || "Customer";
          currentCustomerDetails = customer;

          historyTitle.textContent = `${currentCustomerName} KWh History`;
          historySummary.textContent = `Route ${customer.RouteNumber ?? "-"} \u00b7 ${customer.status ?? "-"} \u00b7 ${customer.caddress ?? "-"}`;

          if (!history.length) {
            historyBody.innerHTML =
              '<tr><td colspan="2" class="empty">No KWh history available.</td></tr>';
          } else {
            const sorted = [...history].sort((a, b) => b.month.localeCompare(a.month));
            historyBody.innerHTML = sorted
              .map(
                (entry) => `
                  <tr>
                    <td>${entry.label}</td>
                    <td style="text-align:center">${Number(entry.value || 0)}</td>
                  </tr>
                `,
              )
              .join("");
          }

          historyModal.classList.add("open");
          historyModal.setAttribute("aria-hidden", "false");
        } catch (error) {
          statusBox.textContent = error.message;
        }
      }

      /* ================================================================== */
      /* Event listeners                                                    */
      /* ================================================================== */
      searchInput.addEventListener("input", () => {
        triggerSearch();
        fetchSuggestions(searchInput.value);
      });

      searchInput.addEventListener("focus", () => {
        if (searchInput.value.trim()) fetchSuggestions(searchInput.value);
      });

      searchInput.addEventListener("blur", () => {
        setTimeout(() => { suggestionsBox.style.display = "none"; }, 180);
      });

      suggestionsBox.addEventListener("mousedown", (event) => {
        const item = event.target.closest(".suggestion-item");
        if (!item) return;
        event.preventDefault();
        selectSuggestedCustomer(
          item.dataset.customerId || "",
          item.dataset.name || searchInput.value,
        );
      });

      resultsBody.addEventListener("click", (event) => {
        const row = event.target.closest("tr[data-customer-id]");
        if (!row || !row.dataset.customerId) return;
        openHistoryModal(row.dataset.customerId);
      });

      closeHistoryModalBtn.addEventListener("click", () => {
        historyModal.classList.remove("open");
        historyModal.setAttribute("aria-hidden", "true");
      });

      downloadHistoryCsvBtn.addEventListener("click", downloadCsvHistory);
      exportResultsCsvBtn.addEventListener("click", exportResultsToCsv);
      exportAllCsvBtn.addEventListener("click", exportAllToCsv);

      historyModal.addEventListener("click", (event) => {
        if (event.target === historyModal) {
          historyModal.classList.remove("open");
          historyModal.setAttribute("aria-hidden", "true");
        }
      });

      routeFilter.addEventListener("input", triggerSearch);
      statusFilter.addEventListener("change", triggerSearch);

      townFilter.addEventListener("change", () => {
        barangayFilter.value = "";
        loadFilters(townFilter.value);
        triggerSearch();
      });

      barangayFilter.addEventListener("change", triggerSearch);
      readingFilter.addEventListener("change", triggerSearch);

      monthFilter.addEventListener("change", () => {
        triggerSearch();
        if (searchInput.value.trim()) fetchSuggestions(searchInput.value);
      });

      searchForm.addEventListener("submit", (event) => {
        event.preventDefault();
        if (debounceTimer) clearTimeout(debounceTimer);
        searchCustomers(
          searchInput.value.trim(),
          statusFilter.value,
          routeFilter.value.trim(),
          townFilter.value,
          barangayFilter.value,
          monthFilter.value,
          1,
        );
      });

      clearFiltersBtn.addEventListener("click", () => {
        searchInput.value = "";
        routeFilter.value = "";
        townFilter.value = "";
        barangayFilter.value = "";
        readingFilter.value = "";
        statusFilter.value = "";
        if (defaultMonthValue) monthFilter.value = defaultMonthValue;
        currentPage = 1;
        loadFilters();
        searchCustomers("", "", "", "", "", monthFilter.value || defaultMonthValue, 1);
      });

      prevPageBtn.addEventListener("click", () => {
        if (currentPage > 1) {
          searchCustomers(
            searchInput.value.trim(),
            statusFilter.value,
            routeFilter.value.trim(),
            townFilter.value,
            barangayFilter.value,
            monthFilter.value,
            currentPage - 1,
          );
        }
      });

      nextPageBtn.addEventListener("click", () => {
        if (currentPage < totalPages) {
          searchCustomers(
            searchInput.value.trim(),
            statusFilter.value,
            routeFilter.value.trim(),
            townFilter.value,
            barangayFilter.value,
            monthFilter.value,
            currentPage + 1,
          );
        }
      });

      loadAvailableMonths();
    </script>
  </body>
</html>
